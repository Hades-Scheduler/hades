name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      # Chart-only changes are handled by release-chart.yml; don't also run the
      # full build/test/deploy pipeline here (one trigger per target).
      - "helm/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "helm/**"
  release:
    types: [released, prereleased]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/*.sum"
      - name: go vet (all modules)
        run: make lint
      - name: gofmt check
        run: |
          set -e
          changed=$(gofmt -l HadesAPI HadesScheduler HadesLogManager shared)
          if [ -n "$changed" ]; then
            echo "::error title=gofmt::Run 'make fmt' locally; the following files need formatting:"
            echo "$changed"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/*.sum"
      - name: go build (all modules)
        run: make build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shared
            path: shared
          - name: HadesAPI
            path: HadesAPI
          - name: HadesScheduler
            path: HadesScheduler
          - name: HadesLogManager
            path: HadesLogManager
          - name: HadesOperator
            path: HadesScheduler/HadesOperator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/*.sum"
      - name: Install dependencies
        run: cd ${{ matrix.path }} && go mod download
      - name: Test
        run: cd ${{ matrix.path }} && go test ./... -json > "${{ github.workspace }}/TestResults-${{ matrix.name }}.json"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Go-results-${{ matrix.name }}
          path: TestResults-${{ matrix.name }}.json

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HadesAPI/web/package-lock.json
      - name: Install dependencies
        run: cd HadesAPI/web && npm ci
      - name: Typecheck
        run: cd HadesAPI/web && npm run lint
      - name: Test
        run: cd HadesAPI/web && npm test
      - name: Build
        run: cd HadesAPI/web && npm run build

  build-api:
    needs: [lint, build, test, ui]
    if: github.actor != 'dependabot[bot]'
    uses: ls1intum/.github/.github/workflows/build-and-push-docker-image.yml@ee1b52f07891ed489887681c09c52b4a83fa9fb2 # v1.2.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: hades-scheduler/hades/hades-api
      docker-file: ./HadesAPI/Dockerfile
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest,enable={{is_default_branch}}

  build-scheduler:
    needs: [lint, build, test]
    if: github.actor != 'dependabot[bot]'
    uses: ls1intum/.github/.github/workflows/build-and-push-docker-image.yml@ee1b52f07891ed489887681c09c52b4a83fa9fb2 # v1.2.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: hades-scheduler/hades/hades-scheduler
      docker-file: ./HadesScheduler/Dockerfile
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest,enable={{is_default_branch}}

  build-operator:
    needs: [lint, build, test]
    if: github.actor != 'dependabot[bot]'
    uses: ls1intum/.github/.github/workflows/build-and-push-docker-image.yml@ee1b52f07891ed489887681c09c52b4a83fa9fb2 # v1.2.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: hades-scheduler/hades/hades-operator
      docker-file: ./HadesScheduler/HadesOperator/Dockerfile
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest,enable={{is_default_branch}}

  build-log-manager:
    needs: [lint, build, test]
    if: github.actor != 'dependabot[bot]'
    uses: ls1intum/.github/.github/workflows/build-and-push-docker-image.yml@ee1b52f07891ed489887681c09c52b4a83fa9fb2 # v1.2.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: hades-scheduler/hades/hades-log-manager
      docker-file: ./HadesLogManager/Dockerfile
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest,enable={{is_default_branch}}
