name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
  pull_request:
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: website/yarn.lock

      - name: Install dependencies
        run: |
          cd website
          yarn install --frozen-lockfile

      - name: Build website
        run: |
          cd website
          yarn build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    # ls1intum/.github main branch @ 396e574
    uses: ls1intum/.github/.github/workflows/build-docusaurus-gh-pages.yml@396e5741a162951516ce357f9b9b77119fb28985
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      docs-path: website
      node-version: "22"
      environment: github-pages
