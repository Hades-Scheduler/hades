name: Deploy to Kubernetes

# Reusable workflow that installs/upgrades the Hades Helm chart into a Kubernetes
# cluster. It is called by deploy-k8s-prod.yml and deploy-k8s-test.yml, which set the
# target GitHub environment, namespace, values file and image tag. It never runs on its
# own trigger.
#
# The GitHub environment supplies these secrets (add them once per environment):
#   KUBE_CONFIG               - kubeconfig (plain YAML) for the target cluster
#   AUTH_KEY                  - protects the API /build endpoint
#   DASHBOARD_USERNAME        - dashboard login user
#   DASHBOARD_PASSWORD_HASH   - bcrypt hash of the dashboard password
#   DASHBOARD_SESSION_SECRET  - dashboard session signing secret (>=32 chars)
# The AUTH_KEY and dashboard values are materialised as in-cluster Secrets
# (hades-auth, hades-dashboard) on every run; the first run creates them and later runs
# keep them in sync. When the dashboard credentials are present, a matching
# hades-jaeger-ui-auth Secret is also created so the Jaeger tracing UI (if enabled by
# the values file) is protected by the same username/password as the dashboard.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy to (k8s-prod or k8s-test).
        required: true
        type: string
      namespace:
        description: Kubernetes namespace to deploy into.
        required: true
        type: string
      values-file:
        description: Environment values file under helm/hades/ (e.g. values-prod.yaml).
        required: true
        type: string
      image-tag:
        description: Container image tag to deploy for all four components.
        required: true
        type: string
      chart-ref:
        description: Git ref to source the chart and CRDs from. Empty = the triggering ref.
        required: false
        type: string
        default: ""
      release-name:
        description: Helm release name.
        required: false
        type: string
        default: hades

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout chart source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.chart-ref }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Ensure namespace exists
        run: |
          set -euo pipefail
          kubectl create namespace "${{ inputs.namespace }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update application Secrets
        env:
          NAMESPACE: ${{ inputs.namespace }}
          AUTH_KEY: ${{ secrets.AUTH_KEY }}
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME }}
          DASHBOARD_PASSWORD_HASH: ${{ secrets.DASHBOARD_PASSWORD_HASH }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
        run: |
          set -euo pipefail
          kubectl create secret generic hades-auth \
            --namespace "$NAMESPACE" \
            --from-literal=AUTH_KEY="$AUTH_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic hades-dashboard \
            --namespace "$NAMESPACE" \
            --from-literal=DASHBOARD_USERNAME="$DASHBOARD_USERNAME" \
            --from-literal=DASHBOARD_PASSWORD_HASH="$DASHBOARD_PASSWORD_HASH" \
            --from-literal=DASHBOARD_SESSION_SECRET="$DASHBOARD_SESSION_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -
          # Basic-auth Secret for the Jaeger tracing UI, reusing the dashboard
          # credentials so the UI shares the dashboard's username/password. The
          # value is an htpasswd line "<user>:<bcrypt-hash>"; the dashboard hash is
          # bcrypt, which the ingress-nginx basic-auth handler accepts. Only created
          # when the dashboard credentials exist; the chart consumes it via
          # tracing.jaeger.ui.auth.existingSecret (test values enable this).
          if [ -n "$DASHBOARD_USERNAME" ] && [ -n "$DASHBOARD_PASSWORD_HASH" ]; then
            kubectl create secret generic hades-jaeger-ui-auth \
              --namespace "$NAMESPACE" \
              --from-literal=auth="${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD_HASH}" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            # Fail closed: if dashboard credentials are removed, drop the stale
            # basic-auth Secret so the Jaeger UI cannot keep accepting the old
            # password.
            kubectl delete secret hades-jaeger-ui-auth \
              --namespace "$NAMESPACE" --ignore-not-found
          fi

      - name: Apply CRDs
        # Helm does not upgrade CRDs after the first install, so apply them explicitly.
        # Server-side apply avoids the 264KB client-side last-applied-configuration
        # annotation limit on the (large) BuildJob CRD.
        run: kubectl apply --server-side --force-conflicts -f helm/hades/crds/

      - name: Build chart dependencies
        run: |
          set -euo pipefail
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm dependency build helm/hades

      - name: Deploy with Helm
        env:
          # Pass the (user-supplied) image tag through the environment and expand it as a
          # quoted shell variable, so a value with shell metacharacters can't be injected
          # into the rendered script.
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail
          helm upgrade --install "${{ inputs.release-name }}" helm/hades \
            --namespace "${{ inputs.namespace }}" --create-namespace \
            -f helm/hades/values.yaml \
            -f "helm/hades/${{ inputs.values-file }}" \
            --set-string hadesApi.image.tag="$IMAGE_TAG" \
            --set-string hadesScheduler.image.tag="$IMAGE_TAG" \
            --set-string hadesOperator.image.tag="$IMAGE_TAG" \
            --set-string hadesLogManager.image.tag="$IMAGE_TAG" \
            --atomic --timeout 10m

      - name: Roll all Hades deployments
        # Force a rollout of every Hades component after the upgrade. This covers two
        # cases Helm does not roll on its own:
        #   1. A mutable image tag (latest, pr-N) whose digest changed but whose tag
        #      string did not: Helm sees an unchanged Deployment spec and rolls nothing,
        #      so the pods keep the previous image. A restart re-pulls (pullPolicy:
        #      Always) the new digest.
        #   2. Rotated Secrets (AUTH_KEY, dashboard creds) that pods read as env vars
        #      only at start.
        # For an immutable tag (a release) Helm already rolls; the extra restart is a
        # harmless no-op.
        run: |
          set -euo pipefail
          deployments="hades-api hades-scheduler hades-operator hades-log-manager"
          for d in $deployments; do
            kubectl rollout restart "deployment/$d" --namespace "${{ inputs.namespace }}"
          done
          for d in $deployments; do
            kubectl rollout status "deployment/$d" --namespace "${{ inputs.namespace }}" --timeout=5m
          done

      - name: Deployment summary
        run: |
          helm status "${{ inputs.release-name }}" --namespace "${{ inputs.namespace }}"
          kubectl get pods --namespace "${{ inputs.namespace }}"

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::Pods"
          kubectl get pods --namespace "${{ inputs.namespace }}" -o wide || true
          echo "::endgroup::"
          echo "::group::Events"
          kubectl get events --namespace "${{ inputs.namespace }}" \
            --sort-by=.lastTimestamp || true
          echo "::endgroup::"
          echo "::group::Not-ready pod details"
          for pod in $(kubectl get pods --namespace "${{ inputs.namespace }}" \
            --field-selector=status.phase!=Running -o name 2>/dev/null); do
            kubectl describe "$pod" --namespace "${{ inputs.namespace }}" || true
            kubectl logs "$pod" --namespace "${{ inputs.namespace }}" \
              --all-containers --tail=100 || true
          done
          echo "::endgroup::"
