# docker compose file for the project with three services

services:
  hadesAPI:
    image: ghcr.io/hades-scheduler/hades/hades-api
    build:
      context: .
      dockerfile: ./HadesAPI/Dockerfile
    ports:
      # Set the Port to 8081 to avoid conflicts with the artemis server
      - "8081:8080"
    networks:
      - hades
    depends_on:
      nats:
        condition: service_healthy
    environment:
      - NATS_URL=nats://nats:4222
      - HADES_VERSION=${HADES_VERSION:-dev}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

  hadesScheduler:
    image: ghcr.io/hades-scheduler/hades/hades-scheduler
    build:
      context: .
      dockerfile: ./HadesScheduler/Dockerfile
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    networks:
      - hades
    depends_on:
      nats:
        condition: service_healthy
      hadesAPI:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - HADES_EXECUTOR=docker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

  hadesLogManager:
    image: ghcr.io/hades-scheduler/hades/hades-log-manager
    build:
      context: .
      dockerfile: ./HadesLogManager/Dockerfile
    ports:
      - "8083:8081"  # Map to 8083 to avoid conflicts
    networks:
      - hades
    depends_on:
      nats:
        condition: service_healthy
      hadesAPI:
        condition: service_started
    environment:
      - HADESLOGMANAGER_API_PORT=8081
      - NATS_URL=nats://nats:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

  nats:
    image: nats:2.11.4
    command: ["-js", "-m", "8222"]
    networks:
      - hades
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "nats-server", "--health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Tracing backend: receives OTLP spans from every service and serves the trace
  # waterfall UI. Ports are also published to the host so services started with
  # `make run` (on the host, not in this network) can export to localhost:4317.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - hades
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver

networks:
  hades:
