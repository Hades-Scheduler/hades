{{- if and .Values.hadesApi.dashboard.secretName (gt (int .Values.hadesApi.replicaCount) 1) }}
{{- fail "hadesApi.dashboard is enabled but hadesApi.replicaCount > 1: the dashboard keeps its session and job state in memory, so it must run as a single replica. Set hadesApi.replicaCount: 1 or disable the dashboard." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "hades-api"
spec:
  replicas: {{ .Values.hadesApi.replicaCount }}
  selector:
    matchLabels:
      app: hades-api-selector
  template:
    metadata:
      labels:
        app: hades-api-selector
    spec:
      containers:
        - name: "hades-api"
          image: "{{ .Values.hadesApi.image.repository }}:{{ .Values.hadesApi.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.hadesApi.image.pullPolicy }}
          resources:
            limits:
              cpu: {{ .Values.hadesApi.resources.limits.cpu | quote }}
              memory: {{ .Values.hadesApi.resources.limits.memory | quote }}
            requests:
              cpu: {{ .Values.hadesApi.resources.requests.cpu | quote }}
              memory: {{ .Values.hadesApi.resources.requests.memory | quote }}
          ports:
            - containerPort: {{ .Values.hadesApi.service.targetPort }}
            - name: metrics
              containerPort: {{ .Values.monitoring.port }}
          livenessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.hadesApi.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.hadesApi.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: DEBUG
              value: {{ .Values.debug | quote }}
            - name: METRICS_PORT
              value: {{ .Values.monitoring.port | quote }}
            - name: NATS_URL
              value: "nats://{{ .Values.nats.host }}:{{ .Values.nats.port }}"
            # Deployed version shown in the dashboard header. Derived from the
            # image tag so it always matches the running build.
            - name: HADES_VERSION
              value: {{ .Values.hadesApi.image.tag | quote }}
            {{- if .Values.hadesApi.authKeySecret }}
            - name: AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hadesApi.authKeySecret | quote }}
                  key: AUTH_KEY
            {{- end }}
            {{- if .Values.hadesApi.dashboard.secretName }}
            # Dashboard credentials. When this Secret is set the operator UI is
            # served and protected; when empty the /api routes return 503.
            - name: DASHBOARD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hadesApi.dashboard.secretName | quote }}
                  key: DASHBOARD_USERNAME
            - name: DASHBOARD_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hadesApi.dashboard.secretName | quote }}
                  key: DASHBOARD_PASSWORD_HASH
            - name: DASHBOARD_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hadesApi.dashboard.secretName | quote }}
                  key: DASHBOARD_SESSION_SECRET
            - name: LOG_MANAGER_URL
              value: {{ .Values.hadesApi.dashboard.logManagerURL | quote }}
            {{- if .Values.hadesApi.dashboard.redactMode }}
            - name: SECRET_REDACT_MODE
              value: {{ .Values.hadesApi.dashboard.redactMode | quote }}
            {{- end }}
            {{- if .Values.hadesApi.dashboard.secretKeyPatterns }}
            - name: SECRET_KEY_PATTERNS
              value: {{ .Values.hadesApi.dashboard.secretKeyPatterns | quote }}
            {{- end }}
            - name: DASHBOARD_SESSION_TTL
              value: {{ .Values.hadesApi.dashboard.sessionTTL | quote }}
            - name: DASHBOARD_JOB_RETENTION
              value: {{ .Values.hadesApi.dashboard.jobRetention | quote }}
            {{- if .Values.hadesApi.dashboard.trustedProxies }}
            - name: DASHBOARD_TRUSTED_PROXIES
              value: {{ join "," .Values.hadesApi.dashboard.trustedProxies | quote }}
            {{- end }}
            {{- if .Values.hadesApi.dashboard.cookieInsecure }}
            - name: DASHBOARD_COOKIE_INSECURE
              value: "true"
            {{- end }}
            {{- end }}
            {{- include "hades.tracingEnv" . | nindent 12 }}
