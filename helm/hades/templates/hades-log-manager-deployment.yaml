apiVersion: apps/v1
kind: Deployment
metadata:
  name: "hades-log-manager"
spec:
  replicas: {{ .Values.hadesLogManager.replicaCount }}
  selector:
    matchLabels:
      app: hades-log-manager-selector
  template:
    metadata:
      labels:
        app: hades-log-manager-selector
    spec:
      containers:
        - name: "hades-log-manager"
          image: "{{ .Values.hadesLogManager.image.repository }}:{{ .Values.hadesLogManager.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.hadesLogManager.image.pullPolicy }}
          resources:
            limits:
              cpu: {{ .Values.hadesLogManager.resources.limits.cpu | quote }}
              memory: {{ .Values.hadesLogManager.resources.limits.memory | quote }}
            requests:
              cpu: {{ .Values.hadesLogManager.resources.requests.cpu | quote }}
              memory: {{ .Values.hadesLogManager.resources.requests.memory | quote }}
          ports:
            - containerPort: {{ .Values.hadesLogManager.service.targetPort }}
            - name: metrics
              containerPort: {{ .Values.monitoring.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.hadesLogManager.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.hadesLogManager.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: DEBUG
              value: {{ .Values.debug | quote }}
            - name: METRICS_PORT
              value: {{ .Values.monitoring.port | quote }}
            - name: NATS_URL
              value: "nats://{{ .Values.nats.host }}:{{ .Values.nats.port }}"
            - name: HADESLOGMANAGER_API_PORT
              value: {{ .Values.hadesLogManager.service.targetPort | quote }}
            - name: STATUS_WEBHOOK_ENABLED
              value: {{ .Values.hadesLogManager.statusWebhook.enabled | quote }}
            - name: STATUS_WEBHOOK_MAX_ATTEMPTS
              value: {{ .Values.hadesLogManager.statusWebhook.maxAttempts | quote }}
            - name: STATUS_WEBHOOK_TIMEOUT
              value: {{ .Values.hadesLogManager.statusWebhook.timeout | quote }}
            - name: STATUS_WEBHOOK_INITIAL_BACKOFF
              value: {{ .Values.hadesLogManager.statusWebhook.initialBackoff | quote }}
            - name: STATUS_WEBHOOK_MAX_BACKOFF
              value: {{ .Values.hadesLogManager.statusWebhook.maxBackoff | quote }}
            - name: STATUS_WEBHOOK_CONCURRENCY
              value: {{ .Values.hadesLogManager.statusWebhook.concurrency | quote }}
            - name: STATUS_WEBHOOK_MAX_PENDING
              value: {{ .Values.hadesLogManager.statusWebhook.maxPending | quote }}
            {{- include "hades.tracingEnv" . | nindent 12 }}
