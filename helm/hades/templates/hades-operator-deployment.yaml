apiVersion: apps/v1
kind: Deployment
metadata:
  name: "hades-operator"
spec:
  replicas: {{ .Values.hadesOperator.replicaCount }}
  selector:
    matchLabels:
      app: hades-operator-selector
  template:
    metadata:
      labels:
        app: hades-operator-selector
    spec:
      serviceAccountName: {{ .Values.rbac.hadesOperator.serviceAccountName }}
      containers:
        - name: "hades-operator"
          image: "{{ .Values.hadesOperator.image.repository }}:{{ .Values.hadesOperator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.hadesOperator.image.pullPolicy }}

          {{- if .Values.hadesOperator.leaderElection.enabled }}
          args:
            - "--leader-elect"
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=:{{ .Values.monitoring.port }}"
          {{- else }}
          args:
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=:{{ .Values.monitoring.port }}"
          {{- end }}

          ports:
            - name: http
              containerPort: {{ .Values.hadesOperator.service.targetPort }}
            - name: healthz
              containerPort: 8081
            - name: metrics
              containerPort: {{ .Values.monitoring.port }}

          env:
            - name: DEBUG
              value: {{ .Values.debug | quote }}
            # The operator's log verbosity is controlled by controller-runtime's
            # DEV_MODE; wire it to the same toggle so debug mode is effective here.
            - name: DEV_MODE
              value: {{ .Values.debug | quote }}
            - name: NATS_URL
              value: "nats://{{ .Values.nats.host }}:{{ .Values.nats.port }}"
            # Reconcile tuning is independent of the watch scope, so unlike
            # WATCH_NAMESPACE (and the DELETE_ON_COMPLETE/MAX_PARALLELISM pair
            # below) these are injected in both namespaced and cluster-wide mode.
            - name: REQUEUE_DELAY
              value: {{ .Values.hadesOperator.requeueDelay | quote }}
            - name: LOG_DRAIN_TIMEOUT
              value: {{ .Values.hadesOperator.logDrainTimeout | quote }}
            {{- if not .Values.hadesOperator.clusterWide }}
            - name: WATCH_NAMESPACE
              value: {{ default .Release.Namespace .Values.hadesOperator.targetNamespace | quote }}
            - name: DELETE_ON_COMPLETE
              value: {{ .Values.hadesOperator.DeleteOnComplete | quote }}
            - name: MAX_PARALLELISM
              value: {{ .Values.hadesOperator.maxParallelism | quote }}
            {{- end }}
            {{- include "hades.tracingEnv" . | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            limits:
              cpu: {{ .Values.hadesOperator.resources.limits.cpu | quote }}
              memory: {{ .Values.hadesOperator.resources.limits.memory | quote }}
            requests:
              cpu: {{ .Values.hadesOperator.resources.requests.cpu | quote }}
              memory: {{ .Values.hadesOperator.resources.requests.memory | quote }}
