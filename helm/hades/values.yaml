# -- Global debug switch. When true, every Hades container gets `DEBUG=true`
# (and the operator additionally gets `DEV_MODE=true`) for verbose logging.
debug: false

hadesApi:
  image:
    repository: ghcr.io/hades-scheduler/hades/hades-api
    # Empty tag defaults to the chart appVersion (see Chart.yaml). Override to pin a specific image tag.
    tag: ""
    # -- Image pull policy for the API.
    pullPolicy: Always
  service:
    type: ClusterIP
    # -- Service port for the API.
    port: 8080
    # -- Container port the API listens on.
    targetPort: 8080
  # -- Number of API replicas.
  replicaCount: 1
  # -- Resource requests and limits for the API pod.
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  # -- Name of an existing Secret holding key `AUTH_KEY` to protect the `/build`
  # endpoint. Empty = no auth (endpoint is open).
  authKeySecret: ""
  # -- Operator dashboard (web UI) served by the API.
  dashboard:
    # -- Name of an existing Secret with keys `DASHBOARD_USERNAME`,
    # `DASHBOARD_PASSWORD_HASH` (a bcrypt hash), and `DASHBOARD_SESSION_SECRET`
    # (>=32 chars). Empty = dashboard disabled (its `/api` routes return 503 and
    # the SPA is not served). Requires TLS (the session cookie is Secure).
    secretName: ""
    # -- Internal URL of HadesLogManager used by the dashboard's logs proxy.
    logManagerURL: "http://hades-log-manager-service:8081"
    # -- Secret redaction mode for job metadata: "smart" (default, key + value
    # heuristics) or "all" (mask every value). Empty uses the smart default.
    redactMode: ""
    # -- Optional regex overriding which metadata keys are treated as secret.
    # Empty uses the built-in pattern (token/password/secret/key/credential/...).
    secretKeyPatterns: ""
    # -- Session cookie lifetime (Go duration).
    sessionTTL: "12h"
    # -- How long finished jobs stay in the dashboard's in-memory list (Go duration).
    jobRetention: "1h"
    # -- CIDRs/IPs of front proxies (e.g. the ingress) allowed to set
    # X-Forwarded-For. Empty trusts none, so the login lockout keys on the
    # un-spoofable direct address. Set to your ingress range behind a proxy.
    trustedProxies: []
    # -- Drop the Secure flag on the session cookie. Only for local HTTP dev;
    # never enable in a real deployment (requires TLS otherwise login breaks).
    cookieInsecure: false

hadesScheduler:
  image:
    repository: ghcr.io/hades-scheduler/hades/hades-scheduler
    # Empty tag defaults to the chart appVersion (see Chart.yaml). Override to pin a specific image tag.
    tag: ""
    # -- Image pull policy for the scheduler.
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  # -- Number of scheduler replicas.
  replicaCount: 1
  # -- Resource requests and limits for the scheduler pod.
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  # -- Executor backend (`k8s` for in-cluster execution).
  executor: "k8s"
  # -- Number of NATS consumer workers each scheduler pod runs. This is a
  # per-replica setting, so the total number of workers consuming the queue is
  # `concurrency * hadesScheduler.replicaCount`. The meaning depends on
  # the executor: with `k8s` a worker only creates a `BuildJob` CR and returns, so
  # this caps how fast queued jobs are turned into CRs (the operator's
  # `hadesOperator.maxParallelism` remains the real limit on running Jobs); with
  # `docker` a worker blocks for the entire job, so this *is* the maximum number of
  # jobs running concurrently on the Docker host. Raise it for `k8s` to keep the
  # scheduler from becoming the bottleneck under a burst; raise it for `docker`
  # only if the host can take the extra parallel containers.
  concurrency: "4"

hadesOperator:
  image:
    repository: ghcr.io/hades-scheduler/hades/hades-operator
    # Empty tag defaults to the chart appVersion (see Chart.yaml). Override to pin a specific image tag.
    tag: ""
    # -- Image pull policy for the operator.
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  # -- Number of operator replicas.
  replicaCount: 1
  # -- Resource requests and limits for the operator pod.
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  # -- Grant cluster-wide RBAC instead of namespace-scoped.
  clusterWide: false
  leaderElection:
    # -- Enable leader election for the operator (recommended with >1 replica).
    enabled: true
  # -- Namespace the operator watches for BuildJob CRs (empty = release namespace).
  targetNamespace: ""
  # -- Delete BuildJob CRs (and their Jobs) once they finish. Defaults to false so
  # completed BuildJobs/pods linger (they self-clean via the Job TTL, ~1h) and the
  # operator can capture every step's logs before the pod is removed; Kubernetes
  # only serves container logs while the pod exists, so immediate deletion can lose
  # logs for fast jobs. Set to true only once the operator captures all logs before
  # deletion (the companion barrier fix).
  DeleteOnComplete: false
  # -- Maximum number of Jobs the operator admits concurrently; excess are suspended.
  maxParallelism: "100"
  # -- How often the operator re-reconciles a BuildJob whose Job is still running
  # (Go duration). The operator watches BuildJobs and the Jobs it owns but not
  # Pods, so container transitions and job completion are only observed on these
  # requeues: completion is detected up to this long after it happens. Lower it
  # for faster completion signalling (or for latency measurements) at the cost of
  # more API-server traffic. A zero or negative duration falls back to the
  # default; a value that is not a valid Go duration fails operator startup.
  requeueDelay: "2s"
  # -- How long a completed BuildJob is kept (undeleted) while its container logs
  # are still being published, before it is deleted anyway (Go duration).
  # Kubernetes only serves container logs while the pod exists, so this is the
  # safety valve on the log-drain gate. Only relevant when DeleteOnComplete is
  # true. A zero or negative duration falls back to the default; a value that is
  # not a valid Go duration fails operator startup.
  logDrainTimeout: "45s"

hadesLogManager:
  image:
    repository: ghcr.io/hades-scheduler/hades/hades-log-manager
    # Empty tag defaults to the chart appVersion (see Chart.yaml). Override to pin a specific image tag.
    tag: ""
    # -- Image pull policy for the log manager.
    pullPolicy: Always
  service:
    type: ClusterIP
    # -- Service port for the log manager.
    port: 8081
    targetPort: 8081
  # -- Keep at 1: the log manager aggregates per-job logs in memory and uses plain
  # (non-queue, non-durable) NATS subscriptions, so multiple replicas would
  # independently forward duplicate/split logs to the Artemis adapter.
  replicaCount: 1
  # -- Resource requests and limits for the log manager pod.
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  # Where aggregated job logs are forwarded is configured per job via the
  # "callback_url" field on the build request, not globally on the log manager.
  statusWebhook:
    # -- Deliver the job-status webhook to each job's "status_callback_url". The
    # feature is inert for jobs that do not set that field, so it is safe to leave
    # enabled. The destination is per job; there is no global webhook URL.
    enabled: true
    # -- Delivery attempts per job (first try plus retries) before the status event is dropped.
    maxAttempts: 6
    # -- Bound on a single delivery, including the callback-URL lookup.
    timeout: 10s
    # -- Delay before the second attempt; doubles per attempt.
    initialBackoff: 5s
    # -- Ceiling for the retry delay.
    maxBackoff: 5m
    # -- Deliveries in flight at once; keeps one dead receiver from delaying other jobs.
    concurrency: 16
    # -- Status events awaiting acknowledgement (in flight or waiting out a retry backoff).
    maxPending: 1000

rbac:
  hadesScheduler:
    # -- ServiceAccount name for the scheduler.
    serviceAccountName: hades-scheduler
    role:
      name: hades-scheduler-role
  hadesOperator:
    # -- ServiceAccount name for the operator.
    serviceAccountName: hades-operator
    role:
      name: hades-operator-role

ingress:
  # -- Enable the Ingress for the API.
  enabled: true
  # -- Ingress class name.
  className: "nginx"

  # -- Public hostname for the API.
  host: hades.student.k8s.aet.cit.tum.de

  tls:
    # -- Enable TLS on the Ingress.
    enabled: true
    # -- Secret name holding the TLS certificate.
    secretName: hades-tls

  # -- Extra annotations for the Ingress (e.g. cert-manager issuer).
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

# -- Prometheus monitoring. Every Hades service exposes a Prometheus `/metrics`
# endpoint on a dedicated, cluster-internal port (never via the public ingress);
# a ServiceMonitor registers them with a cluster Prometheus Operator.
monitoring:
  # -- Render a ServiceMonitor for the Hades services. Requires the Prometheus
  # Operator CRDs (`monitoring.coreos.com`) on the cluster. The `/metrics`
  # endpoints are always exposed; this flag only controls the ServiceMonitor, so
  # the chart installs cleanly on clusters without the Prometheus Operator.
  enabled: false
  # -- Container/Service port each service serves `/metrics` on.
  port: 8082
  serviceMonitor:
    # -- Prometheus scrape interval.
    interval: 30s
    # -- Per-scrape timeout.
    scrapeTimeout: 10s
    # -- Extra labels on the ServiceMonitor so a Prometheus instance selects it
    # (e.g. `{ release: kube-prometheus-stack }`).
    labels: {}

# -- OpenTelemetry tracing. When enabled, every Hades service exports spans to an
# OTLP endpoint so a job's overhead/runtime breakdown is visible as a per-job
# trace waterfall (API -> scheduler -> operator). Disabled by default: with no
# endpoint the services run a noop tracer, so the chart installs cleanly without
# a tracing backend.
tracing:
  # -- Export OTLP spans from every service. Requires a resolvable endpoint
  # (`tracing.endpoint`, or the bundled Jaeger via `tracing.deployJaeger`).
  enabled: false
  # -- OTLP gRPC endpoint spans are exported to (an OpenTelemetry Collector or a
  # Jaeger with OTLP enabled), e.g. `http://otel-collector.observability:4317`.
  # When empty and `deployJaeger` is true, the bundled Jaeger is used.
  endpoint: ""
  # -- Deploy an in-cluster Jaeger all-in-one as the tracing backend and UI. It
  # stores traces in memory, so it is for dev/test clusters, not production;
  # point `endpoint` at a real collector there instead.
  deployJaeger: false
  jaeger:
    # -- Jaeger all-in-one image used when `deployJaeger` is true.
    image: jaegertracing/all-in-one:1.62.0
    # -- Bundled-Jaeger UI exposure. The UI Service is ClusterIP (in-cluster /
    # port-forward only) by default; enable this Ingress to reach it from
    # outside. It is protected by HTTP basic auth - rendering fails if enabled
    # without a password or an existing secret.
    #
    # IMPORTANT: the basic auth is enforced with ingress-nginx annotations
    # (`nginx.ingress.kubernetes.io/auth-*`), so the login only takes effect when
    # `className` routes to an ingress-nginx controller. If you point it at a
    # different controller (Traefik, HAProxy, ...), those annotations are ignored
    # and the UI would be exposed WITHOUT auth - provide equivalent auth for that
    # controller instead, or keep it ClusterIP + port-forward.
    ui:
      ingress:
        # -- Expose the Jaeger UI via an Ingress (behind ingress-nginx basic auth).
        enabled: false
        # -- Ingress class for the UI. Basic auth requires an ingress-nginx
        # controller (see the note above); other controllers ignore the auth
        # annotations.
        className: "nginx"
        # -- Hostname for the Jaeger UI. Required when `enabled`.
        host: ""
        # -- Extra annotations merged onto the UI Ingress.
        annotations: {}
        tls:
          # -- Enable TLS on the UI Ingress.
          enabled: false
          # -- TLS secret for the UI host.
          secretName: ""
      auth:
        # -- Use a pre-created basic-auth Secret (an `auth` key holding htpasswd
        # lines). When set, `username`/`password` are ignored and no Secret is
        # generated.
        existingSecret: ""
        # -- Basic-auth username for the generated htpasswd Secret.
        username: "admin"
        # -- Basic-auth password. Required when the UI Ingress is enabled and no
        # `existingSecret` is given; the chart hashes it into an htpasswd Secret.
        password: ""

nats:
  config:
    jetstream:
      # -- Enable JetStream (required by Hades).
      enabled: true
      memoryStore:
        enabled: true
        # -- Maximum in-memory JetStream store size.
        maxSize: 1Gi
      # fileStore:
      #   enabled: true
      #   dir: /data
      #   pvc:
      #     enabled: true
      #     size: 10Gi
      #   maxSize: 10Gi
  # -- In-cluster NATS service hostname.
  host: "hades-nats.hades.svc.cluster.local"
  # -- NATS client port.
  port: 4222
